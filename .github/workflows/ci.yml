name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # PINNED to the documented toolchain (AGENTS.md §2). The format gate
          # is formatter-version-sensitive: a floating 'stable' picked up
          # 3.47.7 / Dart 3.13.5 and failed the gate on constructs the local
          # 3.47.5 / Dart 3.13.4 formatter accepts. CI must run the SAME
          # formatter as the dev box, or the gate measures the SDK, not the code.
          flutter-version: 3.47.5
      - run: flutter pub get
      # `pub get` silently rewrites the lock when the committed one cannot be
      # satisfied by the pinned SDK, and nothing downstream notices: the
      # dependabot drift bump landed a lock demanding test_api 0.7.14, which
      # Flutter 3.47.5's flutter_test pins to exactly 0.7.12, and CI stayed
      # green while every local `pub get` produced a different lock.
      - name: pubspec.lock is reproducible on the pinned SDK
        run: git diff --exit-code -- pubspec.lock
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      # Committed generated sources must be current. Without this, a hand-edited
      # (or stale) app_localizations*.dart / *.freezed.dart / *.g.dart can pass
      # as long as it still compiles — the same class of drift the web data gate
      # catches on the other side of the repo.
      - name: Generated code is current
        run: |
          git diff --exit-code -- lib/l10n ':(glob)**/*.g.dart' ':(glob)**/*.freezed.dart'
          test -z "$(git ls-files --others --exclude-standard -- lib/l10n ':(glob)**/*.g.dart' ':(glob)**/*.freezed.dart')"
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib test tools
      - run: flutter test

  # DEBUG-SIGNED ARTIFACTS ONLY. This job is gated on analyze-test and its
  # outputs are deliberately named `debug-signed-*`: android/key.properties is
  # gitignored and absent on CI, so these builds must never be mistaken for a
  # store upload. The store-bound AAB is built locally with PUBLISH_RELEASE=true
  # and the owner keystore (docs/store/play-console-setup.md).
  release-artifact:
    needs: [analyze-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-signed-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
