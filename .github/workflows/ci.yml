name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # PINNED to the documented toolchain (AGENTS.md §2). The format gate
          # is formatter-version-sensitive: a floating 'stable' picked up
          # 3.47.7 / Dart 3.13.5 and failed the gate on constructs the local
          # 3.47.5 / Dart 3.13.4 formatter accepts. CI must run the SAME
          # formatter as the dev box, or the gate measures the SDK, not the code.
          flutter-version: 3.47.5
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib test tools
      - run: flutter test

  # Release artifacts built on every push to main. NOTE: artifacts are
  # debug-signed until the owner's keystore lands (W7c) — android/key.properties
  # is gitignored and intentionally absent on CI.
  release-artifact:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
