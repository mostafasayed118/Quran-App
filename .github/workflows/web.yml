name: web-gates
on:
  # Every input of the shipped site is listed: the web app, the two data
  # exporters, the city list they read, the app's Quran DB they read, the
  # privacy pages' markdown and this workflow. A commit that touches only one
  # of them still ships the web, so it has to run the gates.
  push:
    paths:
      - 'web/**'
      - 'tools/export_web_data.dart'
      - 'tools/export_web_prayer_times.dart'
      - 'assets/data/cities.json'
      - 'assets/db/quran.sqlite'
      - 'PRIVACY.md'
      - 'PRIVACY.en.md'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'tools/export_web_data.dart'
      - 'tools/export_web_prayer_times.dart'
      - 'assets/data/cities.json'
      - 'assets/db/quran.sqlite'
      - 'PRIVACY.md'
      - 'PRIVACY.en.md'
      - '.github/workflows/web.yml'
  # The prayer-times freshness guard (web/tests/unit/prayer-window.test.ts)
  # ages out ~3 months before the shipped window ends; the monthly run trips it
  # even when nothing is pushed. Path filters do not apply to these triggers.
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
jobs:
  gates:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      # Pinned to the commit of the v4 tag: a mutable tag can be moved to a
      # different commit, and this workflow runs the deploy gate.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      # The e2e specs drive a real Chromium; the runner does not ship one.
      - run: npx playwright install --with-deps chromium
      # One gate battery, defined once in web/package.json (check, test, build,
      # budget, e2e) so CI can never drift from `npm run gates`.
      - run: npm run gates
      # Dependency advisories on the shipped tree (astro + its runtime deps only).
      # Deliberately not forced green: a reported advisory must fail this gate.
      - run: npm audit --omit=dev

  # The site ships GENERATED data: the Quran text comes from the app's SQLite
  # DB (tools/export_web_data.dart) and the prayer times from the city list
  # (tools/export_web_prayer_times.dart). Both were regenerated by hand, so a
  # commit could ship stale Quran text behind a green gate. This job re-runs
  # the exporters and fails if the committed bytes differ from the source.
  data-drift:
    runs-on: ubuntu-latest
    # adhan rounds each prayer in the HOST timezone; a DST host can shift a
    # prayer by an hour. Pin UTC so the committed data regenerates byte-exact.
    env:
      TZ: UTC
    steps:
      # Same SHA-pinned checkout as the gates job: a mutable tag can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Same toolchain pin as the app CI (.github/workflows/ci.yml): the
      # exporters import the app's own packages, so they must read the same DB
      # with the same Dart the data was generated with.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - run: flutter pub get
      - run: dart run tools/export_web_data.dart
      - run: dart run tools/export_web_prayer_times.dart
      - name: Assert the committed data still matches its source
        run: |
          # ONLY the exporter-owned paths. web/src/data/reciters-snapshot.json is
          # deliberately NOT listed: it comes from web/scripts/fetch-reciters.mjs,
          # which needs the network, so it can never be regenerated here.
          set -euo pipefail
          PATHS=(
            web/src/data/ayahs
            web/src/data/surahs.json
            web/src/data/search-index.json
            web/public/data/prayer-times
          )
          if ! git --no-pager diff --exit-code -- "${PATHS[@]}"; then
            echo "::error::Generated web data drifted from its source. Re-run the two exporters with TZ=UTC and commit the result."
            git --no-pager diff --stat -- "${PATHS[@]}"
            exit 1
          fi
          # git diff cannot see a file the exporters CREATED, so also fail on
          # untracked files under those paths.
          UNTRACKED="$(git ls-files --others --exclude-standard -- "${PATHS[@]}")"
          if [ -n "$UNTRACKED" ]; then
            echo "::error::The exporters produced files that are not committed:"
            echo "$UNTRACKED"
            exit 1
          fi
          echo "OK: the committed web data matches its source."
