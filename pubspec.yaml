name: quran_yahdi
description: "Quran Yahdi - a complete offline-first Islamic companion app"
publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  drift: ^2.35.2
  get_it: ^9.3.0
  dio: ^5.11.1
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  path: ^1.9.1
  meta: ^1.19.0
  crypto: ^3.0.7
  scrollable_positioned_list: ^0.3.8
  just_audio: ^0.10.6
  adhan: ^2.0.0+1
  hijri: ^3.0.1
  just_audio_background: ^0.0.1-beta.17
  geolocator: ^14.0.1
  sensors_plus: ^7.1.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  app_links: ^7.2.2
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  workmanager: ^0.10.10
  home_widget: ^0.10.0
  cryptography: ^2.9.0
  # Force Update + store-listing button; owner-approved 2026-11-09 (release-readiness session).
  package_info_plus: ^10.2.2
  # In-App Review prompt (requestReview); owner-approved 2026-11-09.
  in_app_review: ^2.0.12

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo_master.png"
  adaptive_icon_background: "#012A27"
  adaptive_icon_foreground: "assets/icons/logo_master.png"
  remove_alpha_ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.16.2
  freezed: ^4.0.3
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  path_provider_platform_interface: ^2.1.3
  # Used by tools/build_quran_db.dart (outside lib/), not shipped in the app.
  collection: ^1.19.1
  # Used by the tools/ scripts only; the shipped app talks HTTP through dio.
  http: ^1.6.0

flutter_native_splash:
  color: "#EFE9DA"
  image: "assets/icons/splash_mark.png"
  color_dark: "#101410"
  image_dark: "assets/icons/splash_mark_dark.png"
  android_12:
    color: "#EFE9DA"
    image: "assets/icons/splash_mark_android12.png"
    icon_background_color: "#EFE9DA"
    color_dark: "#101410"
    image_dark: "assets/icons/splash_mark_android12.png"
    icon_background_color_dark: "#101410"
  android: true
  ios: true
  web: false

flutter:

  uses-material-design: true
  generate: true
  assets:
    - assets/db/
    - assets/data/
    - assets/licenses/
    - assets/quran/uthmani/
    # Adhan audio: full tracks and their notification clips are separate
    # directories on purpose - Flutter asset directory entries are NOT
    # recursive, so the clips/ entry is required.
    - assets/audio/adhan/
    - assets/audio/adhan/clips/
    - assets/fonts/Cairo-OFL.txt
    # In-app splash glyph (calligraphy only, no margin); the master/logo files
    # stay out of the bundle on purpose.
    - assets/icons/logo_glyph.png

  fonts:
    - family: HafsSmart
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf

    - family: me_quran
      fonts:
        - asset: assets/fonts/me_quran.ttf

    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
