name: quran_yahdi
description: "Quran Yahdi - a complete offline-first Islamic companion app"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  drift: ^2.35.2
  get_it: ^9.3.0
  dio: ^5.11.1
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  path: ^1.9.1
  meta: ^1.19.0
  http: ^1.6.0
  crypto: ^3.0.7
  scrollable_positioned_list: ^0.3.8
  just_audio: ^0.10.6
  adhan: ^2.0.0+1
  hijri: ^3.0.1
  just_audio_background: ^0.0.1-beta.17
  geolocator: ^14.0.1
  sensors_plus: ^7.1.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  app_links: ^7.2.2
  share_plus: ^13.3.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_2.png"
  remove_alpha_ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  freezed: ^4.0.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  path_provider_platform_interface: ^2.1.3
  # Used by tools/build_quran_db.dart (outside lib/), not shipped in the app.
  collection: ^1.19.1

flutter_native_splash:
  color: "#f1ead7"
  image: "assets/icons/app_icon_2.png"
  android: true
  ios: true

flutter:

  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/db/
    - assets/data/
    - assets/fonts/Cairo-OFL.txt

  fonts:
    - family: HafsSmart
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf

    - family: me_quran
      fonts:
        - asset: assets/fonts/me_quran.ttf

    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
