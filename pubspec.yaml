name: quran_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  arabic_numbers: ^1.0.0
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  device_preview: ^1.3.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_2.png"

dev_dependencies:
  lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_native_splash:
  color: "#f1ead7"
  image: "assets/icons/app_icon_2.png"
  android: true
  ios: true

flutter:

  uses-material-design: true
  assets:
    - assets/icons/
    - assets/json/

  fonts:
    - family: quran
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf

    - family: me_quran
      fonts:
        - asset: assets/fonts/me_quran.ttf
